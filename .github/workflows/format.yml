name: citra-format

on:
  # Skip the feature branch used for the 30fps optimization sprint — we only
  # care about the android build there and want each iteration to be as short
  # as possible. GitHub Actions rejects a mix of `branches` and
  # `branches-ignore`, so this is branches-ignore-only.
  push:
    branches-ignore: [ "claude/**" ]
  pull_request:
    branches: [ master ]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: ./.ci/clang-format.sh
